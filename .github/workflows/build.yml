name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  engine-and-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MyEngine.slnx
      - name: Build (engine, editor, game, website server)
        run: dotnet build MyEngine.slnx --configuration Release --no-restore

  website-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website/Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/Client/package-lock.json
      - run: npm ci
      - name: Type-check + build
        run: npm run build
